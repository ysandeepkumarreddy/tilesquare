<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#08080f" />
  <title>TileSquare — New Tab</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" href="favicon.svg" />
  <link rel="stylesheet" href="app.css" />
  <script src="config.js"></script>
</head>
<body>

<main class="center" id="main">
  <div class="home">
    <span class="greeting-line" id="greeting-line"></span>

    <time
      class="clock"
      id="clock"
      tabindex="0"
      role="button"
      aria-label="Open navigation shortcuts"
    ></time>
    <span class="date-line" id="date-line"></span>
    <span class="weather-line" id="weather-line"></span>

    <form
      autocomplete="off"
      class="search-form"
      id="search-form"
      spellcheck="false"
      role="search"
    >
      <input
        class="search-input"
        id="search-input"
        aria-label="Search or navigate"
        type="text"
      />
      <ul
        class="search-suggestions"
        id="search-suggestions"
        role="listbox"
        aria-label="Search suggestions"
      ></ul>
      <div class="engine-indicator" id="engine-indicator" aria-live="polite"></div>
    </form>

    <span class="clock-hint" id="clock-hint">press any key &nbsp;·&nbsp; ? for shortcuts</span>
  </div>
</main>

<nav
  class="help"
  id="help"
  aria-label="Quick navigation shortcuts"
></nav>

<div id="todo-widget" class="todo-widget"></div>
<div id="cal-widget" class="cal-widget"></div>
<div id="joke-widget" class="joke-card"></div>
<div id="weather-tip" class="weather-tip"></div>
<div id="onboarding" class="onboarding"></div>

<script src="app.js"></script>
</body>
</html>
